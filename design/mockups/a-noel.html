<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup A · Noel-Stil</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fbfbfc; --ink: #0f1318; --mut: #59616a; --dim: #8a929b;
    --card: #ffffff; --surf: #f3f4f7; --line: #e5e7eb; --rand: #e2e5ea;
    --accent: #3a4fc4; --accent-soft: rgba(58, 79, 196, .08);
    --rot: #c8402a; --gelb: #c98a06; --gruen: #2f8f5b;
    --shadow: 0 26px 50px -30px rgba(20, 24, 28, .25);
    --r-s: 10px; --r-m: 16px; --r-l: 22px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: Archivo, -apple-system, system-ui, sans-serif; color: var(--ink); background: var(--bg);
    background-image: radial-gradient(rgba(70, 88, 170, .10) 1px, transparent 1px); background-size: 22px 22px;
    -webkit-font-smoothing: antialiased; line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
  .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
  .mark i { color: #8fa0ff; font-style: normal; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--mut); }
  .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; }
  header.hero { padding: 36px 0 28px; }
  h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 700; letter-spacing: -.04em; line-height: 1.05; margin: 14px 0 12px; }
  h1 .serif { font-size: 1.04em; }
  .lead { color: var(--mut); font-size: 17px; max-width: 560px; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 8px 0 28px; }
  .kpi { background: var(--card); border: 1px solid var(--rand); border-radius: var(--r-m); padding: 18px 20px; box-shadow: var(--shadow); }
  .kpi .v { font-size: 34px; font-weight: 700; letter-spacing: -.04em; line-height: 1.1; margin-top: 6px; }
  .kpi .s { font-size: 13px; color: var(--mut); }
  .kpi.alert .v { color: var(--rot); }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line2, #d3d7dd); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  .sort { margin-left: auto; font-size: 13px; color: var(--mut); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; padding-bottom: 40px; }
  .card { background: var(--card); border: 1px solid var(--rand); border-radius: var(--r-l); box-shadow: var(--shadow); }
  .list { overflow: hidden; }
  .row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 14px; padding: 16px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--surf); }
  .row.sel { background: var(--accent-soft); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
  .dot.rot { background: var(--rot); box-shadow: 0 0 0 4px rgba(200, 64, 42, .12); }
  .dot.gelb { background: var(--gelb); box-shadow: 0 0 0 4px rgba(201, 138, 6, .12); }
  .dot.gruen { background: var(--gruen); }
  .name { font-weight: 600; letter-spacing: -.01em; }
  .meta { font-size: 13px; color: var(--mut); }
  .reason { grid-column: 2 / 4; font-size: 14px; color: var(--ink); opacity: .82; }
  .score { font-weight: 700; font-size: 20px; letter-spacing: -.03em; text-align: right; }
  .score small { display: block; font-size: 11px; font-weight: 500; color: var(--dim); letter-spacing: .02em; }
  .pill { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surf); color: var(--mut); margin-left: 6px; }

  .detail { padding: 24px; position: sticky; top: 16px; }
  .d-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
  .d-head h2 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; margin-top: 8px; }
  .big { font-size: 52px; font-weight: 700; letter-spacing: -.05em; line-height: 1; text-align: right; }
  .status { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; margin-top: 6px; }
  .status.rot { background: rgba(200, 64, 42, .1); color: var(--rot); }
  .status.gelb { background: rgba(201, 138, 6, .12); color: #9a6a05; }
  .status.gruen { background: rgba(47, 143, 91, .1); color: var(--gruen); }
  section.block { margin-top: 24px; }
  section.block > .eyebrow { margin-bottom: 10px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--mut); margin-bottom: 6px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--c); }
  .legend .dash::before { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
  .reasons { list-style: none; padding: 0; display: grid; gap: 8px; }
  .reasons li { display: flex; gap: 12px; align-items: baseline; font-size: 15px; }
  .reasons b { font-variant-numeric: tabular-nums; color: var(--rot); min-width: 34px; font-weight: 600; font-size: 13px; }
  .next { background: var(--surf); border-radius: var(--r-m); padding: 16px 18px; font-size: 15px; }
  .next .serif { font-size: 19px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .step { font-size: 12px; color: var(--mut); }
  .bar { height: 6px; border-radius: 99px; background: var(--line); margin-bottom: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); }
  .step.cur { color: var(--ink); font-weight: 600; }
  .open { font-size: 13px; color: var(--mut); margin-top: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 14px 24px; font: inherit; font-weight: 500; font-size: 15px; cursor: pointer; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .note { font-size: 14px; color: var(--mut); border-left: 2px solid var(--rand); padding-left: 12px; }
  footer { border-top: 1px solid var(--line); padding: 22px 0 36px; font-size: 13px; color: var(--mut); }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .detail { position: static; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .wrap { padding: 0 16px; }
    #asof { display: none; }
    .kpi .v { font-size: 28px; }
    .sort { margin-left: 0; width: 100%; }
    .sep { display: none; }
    .big { font-size: 42px; }
    .row { padding: 14px 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <div class="brand"><span class="mark">ng<i>.</i></span> Customer Health</div>
    <span class="eyebrow" id="asof"></span>
  </nav>
  <header class="hero">
    <p class="eyebrow">Prototyp · Customer Success Paid Parking</p>
    <h1>Wer braucht <span class="serif">heute</span> Aufmerksamkeit?</h1>
    <p class="lead">20 Parkflächen-Kunden, ein nachvollziehbarer Health Score und der nächste sinnvolle Schritt.</p>
  </header>
  <div class="kpis" id="kpis"></div>
  <div class="filters">
    <button class="chip on">Alle</button>
    <button class="chip"><span class="dot rot" style="margin:0"></span>Gefährdet</button>
    <button class="chip"><span class="dot gelb" style="margin:0"></span>Beobachten</button>
    <button class="chip"><span class="dot gruen" style="margin:0"></span>Stabil</button>
    <span class="sep"></span>
    <button class="chip">Segment ▾</button>
    <button class="chip">Onboarding-Phase ▾</button>
    <span class="sort">Sortiert: dringendste zuerst</span>
  </div>
  <div class="grid">
    <div class="card list" id="list"></div>
    <aside class="card detail" id="detail"></aside>
  </div>
</div>
<footer><div class="wrap">Prototyp von Noel Gruber · Beispieldaten · nicht mit Wemolo verbunden</div></footer>

<script type="module">
  import { rows, kpis, detail, asOfLabel, formatPercent, checklistFor, chartFor, wireSelection, esc } from "./shared.js";

  document.getElementById("asof").textContent = `Stichtag ${asOfLabel}`;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="eyebrow">Kunden</div><div class="v">${kpis.total}</div><div class="s">Parkflächen gesamt</div></div>
    <div class="kpi alert"><div class="eyebrow">Gefährdet</div><div class="v">${kpis.rot}</div><div class="s">+ ${kpis.gelb} beobachten</div></div>
    <div class="kpi"><div class="eyebrow">Im Onboarding</div><div class="v">${kpis.onboarding}</div><div class="s">noch nicht live</div></div>
    <div class="kpi"><div class="eyebrow">Ø Zahlungsquote</div><div class="v">${formatPercent(kpis.avgPayment)}</div><div class="s">letzte Woche, live</div></div>`;

  const list = document.getElementById("list");
  const renderList = (sel) => {
    list.innerHTML = rows.map((r) => `
      <div class="row ${r.id === sel ? "sel" : ""}" data-id="${r.id}">
        <span class="dot ${r.health.status}"></span>
        <div><div class="name">${esc(r.name)}</div><div class="meta">${r.segmentLabel} · ${esc(r.city)}<span class="pill">${r.phaseLabel}</span></div></div>
        <div class="score">${r.health.score}<small>Score</small></div>
        ${r.health.reasons[0] ? `<div class="reason">${esc(r.health.reasons[0].text)}</div>` : ""}
      </div>`).join("");
  };

  const renderDetail = (r) => {
    const chart = chartFor(r, { payment: "#0f1318", occupancy: "#3a4fc4", dash: "5 4" }, { grid: "#eceef1", label: "#8a929b" });
    const phases = checklistFor(r);
    const open = phases.flatMap((p) => p.items).filter((i) => !i.done);
    document.getElementById("detail").innerHTML = `
      <div class="d-head">
        <div><p class="eyebrow">${r.segmentLabel} · ${esc(r.city)} · ${r.spaces} Stellplätze</p><h2>${esc(r.name)}</h2>
          <span class="status ${r.health.status}">${{ rot: "Gefährdet", gelb: "Beobachten", gruen: "Stabil" }[r.health.status]}</span></div>
        <div><div class="big">${r.health.score}</div><div class="hint" style="text-align:right">von 100</div></div>
      </div>
      <section class="block"><p class="eyebrow">Verlauf · 8 Wochen</p>
        ${chart ? `<div class="legend"><span style="--c:#0f1318">Zahlungsquote</span><span class="dash" style="--c:#3a4fc4">Auslastung</span></div>${chart}` : `<p class="note">Noch keine Betriebsdaten: Der Kunde ist im Onboarding.</p>`}
      </section>
      <section class="block"><p class="eyebrow">Warum ${{ rot: "rot", gelb: "gelb", gruen: "grün" }[r.health.status]}?</p>
        ${r.health.reasons.length ? `<ul class="reasons">${r.health.reasons.map((x) => `<li><b>${x.points}</b>${esc(x.text)}</li>`).join("")}</ul>` : `<p class="note">Keine Auffälligkeiten.</p>`}
      </section>
      <section class="block"><p class="eyebrow">Nächster Schritt</p>
        <div class="next"><span class="serif">Empfehlung:</span> ${esc(r.health.nextStep)}</div>
      </section>
      <section class="block"><p class="eyebrow">Readiness · ${r.readiness.done}/${r.readiness.total}</p>
        <div class="steps">${phases.map((p) => { const d = p.items.filter((i) => i.done).length; return `<div class="step ${p.current ? "cur" : ""}"><div class="bar"><i style="width:${(d / p.items.length) * 100}%"></i></div>${p.label}</div>`; }).join("")}</div>
        ${open.length ? `<p class="open">Offen: ${open.map((i) => esc(i.label)).join(" · ")}</p>` : ""}
      </section>
      <section class="block"><p class="eyebrow">Letzte Notiz</p><p class="note">${esc(r.note)}</p></section>
      ${r.health.status !== "gruen" ? `<section class="block"><button class="btn">✦ Bericht &amp; Mail-Entwurf</button><p class="hint">Text vorab mit Claude erzeugt</p></section>` : ""}`;
  };

  const select = (r) => { renderList(r.id); renderDetail(r); };
  wireSelection(list, select);
  select(detail);
</script>
</body>
</html>
